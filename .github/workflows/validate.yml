name: Validate Home Assistant integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check syntax and metadata
        run: |
          python -m compileall -q custom_components/heartbeat_comparison
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("custom_components/heartbeat_comparison")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["domain"] == "heartbeat_comparison"
          assert manifest["version"]
          json.loads((root / "strings.json").read_text())
          json.loads(Path("hacs.json").read_text())
          print("Validation passed")
          PY
